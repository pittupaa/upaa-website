<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0A2342; --navy-2:#12345B; --gold:#FFB81C; --gold-deep:#B87D00;
    --paper:#F7F5EF; --paper-2:#EFEBE0; --ink:#1A1F26; --ink-soft:#4A5361;
    --line:#D9D3C4; --white:#FFFFFF; --danger:#B03A32; --ok:#2E7D5B;
    --shadow:0 1px 2px rgba(10,35,66,.06),0 8px 24px rgba(10,35,66,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .serif{font-family:'Fraunces',Georgia,serif}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .ticker{background:var(--navy);color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;padding:7px 0;overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--gold)}
  .ticker span{display:inline-block;padding-left:100%;animation:tick 30s linear infinite}
  @keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

  nav{position:sticky;top:0;z-index:50;background:rgba(247,245,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:none;font:inherit;text-align:left}
  .brand-mark{width:38px;height:38px;background:var(--navy);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-mark b{color:var(--white);font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:-.5px}
  .brand-mark b .g{color:var(--gold)}
  .brand-txt small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .brand-txt strong{font-family:'Fraunces',serif;font-size:17px;font-weight:600;letter-spacing:-.3px;color:var(--navy)}
  .nav-links{display:flex;gap:2px;align-items:center}
  .nav-links button{font:inherit;font-size:14px;font-weight:500;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:8px 11px;border-radius:6px;transition:.15s;white-space:nowrap}
  .nav-links button:hover{color:var(--navy);background:var(--paper-2)}
  .nav-links button.on{color:var(--navy);font-weight:600}
  .nav-cta{background:var(--navy)!important;color:var(--paper)!important;font-weight:600!important;margin-left:6px}
  .nav-cta:hover{background:var(--navy-2)!important}
  .burger{display:none;background:none;border:none;cursor:pointer;font-size:22px;color:var(--navy)}

  main{max-width:1120px;margin:0 auto;padding:0 24px}
  .section{padding:72px 0}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:9px}
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--gold-deep)}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;line-height:1.08;letter-spacing:-.02em;color:var(--navy)}
  .h-sec{font-size:clamp(28px,4vw,40px);margin-bottom:16px}
  .lead{font-size:18px;color:var(--ink-soft);max-width:62ch}

  .hero{position:relative;padding:80px 0 68px;overflow:hidden}
  .hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.5;mask-image:radial-gradient(ellipse 80% 70% at 70% 30%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 70% at 70% 30%,#000 30%,transparent 75%)}
  .hero-in{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  .hero h1{font-size:clamp(38px,6vw,62px);margin-bottom:20px}
  .hero h1 em{font-style:italic;color:var(--gold-deep)}
  .hero p{font-size:19px;color:var(--ink-soft);max-width:48ch;margin-bottom:16px}
  .meet-line{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--navy);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:9px 13px;display:inline-block;margin-bottom:26px}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:600;font-size:15px;padding:13px 22px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-primary{background:var(--navy);color:var(--paper)}
  .btn-primary:hover:not(:disabled){background:var(--navy-2);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--navy);background:var(--white)}

  .ledger{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .ledger-top{background:var(--navy);color:var(--paper);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em}
  .ledger-top .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .ledger-row{display:grid;grid-template-columns:1fr auto;padding:12px 18px;border-bottom:1px solid var(--paper-2);font-size:14px;gap:12px}
  .ledger-row:last-of-type{border-bottom:none}
  .ledger-row span:first-child{color:var(--ink-soft)}
  .ledger-row span:last-child{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--navy);text-align:right}
  .ledger-next{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:rgba(255,184,28,.10);border:none;border-top:1px solid var(--line);
    padding:15px 18px 17px;transition:.15s;border-radius:0 0 13px 13px}
  .ledger-next:hover{background:rgba(255,184,28,.20)}
  .ledger-next .lbl{display:flex;align-items:center;justify-content:space-between;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:5px}
  .ledger-next .when{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);display:block}
  .ledger-next .what{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;color:var(--navy);
    line-height:1.25;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden}
  .ledger-next .arrow{font-size:13px;color:var(--gold-deep)}
  .ledger-tba{border-top:1px solid var(--line);padding:15px 18px 17px;border-radius:0 0 13px 13px;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft)}
  .ledger-foot{background:var(--paper-2);padding:12px 18px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--navy)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stat{background:var(--paper);padding:26px 22px}
  .stat b{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--navy);display:block;line-height:1}
  .stat small{font-size:13px;color:var(--ink-soft);font-weight:500}

  .grid{display:grid;gap:20px}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:26px;transition:.15s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .card .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold-deep);font-weight:500}
  .card h3{font-size:20px;margin:10px 0 8px}
  .card p{font-size:14.5px;color:var(--ink-soft)}

  /* ---- e-board ---- */
  .board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .member{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.15s;display:flex;flex-direction:column}
  .member:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .member .ph{position:relative;aspect-ratio:1;overflow:hidden;
    background:linear-gradient(140deg,var(--navy),var(--navy-2));
    display:flex;align-items:center;justify-content:center}
  .member .ph img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block;max-width:none;max-height:none}
  .member .ph .init{font-family:'Fraunces',serif;font-size:44px;color:var(--paper);font-weight:600;letter-spacing:1px}
  .member .ph .tag{position:absolute;top:12px;left:12px;background:var(--gold);color:var(--navy);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;padding:4px 8px;border-radius:5px}
  .member .info{padding:16px 18px;flex:1;display:flex;flex-direction:column}
  .member .info b{font-family:'Fraunces',serif;font-size:18px;color:var(--navy);display:block}
  .member .info .role{font-size:12.5px;color:var(--gold-deep);font-weight:600;text-transform:uppercase;letter-spacing:.03em;display:block}
  .member .info .yr{font-size:13px;color:var(--ink-soft);margin-top:7px;display:block}
  .member .info .majors{margin-top:3px;display:flex;flex-wrap:wrap;gap:5px}
  .member .info .majors span{font-size:11.5px;color:var(--navy);background:var(--paper-2);border-radius:99px;padding:2px 9px;white-space:nowrap}
  .member .info .bio{font-size:13.5px;color:var(--ink-soft);margin-top:10px;line-height:1.55;display:block}
  .m-links{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--paper-2)}
  /* uploads + framing */
  .drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;background:var(--paper);transition:.15s}
  .drop:hover,.drop.over{border-color:var(--gold);background:#FFFDF6}
  .drop.busy{opacity:.6;cursor:progress}
  .drop b{display:block;font-size:13.5px;color:var(--navy)}
  .drop small{font-size:12px;color:var(--ink-soft)}
  .pp-row{display:flex;gap:12px;align-items:flex-start}
  .pp-thumb{position:relative;width:72px;height:72px;border-radius:9px;border:1px solid var(--line);
    background:var(--paper-2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .pp-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    max-width:none;max-height:none}
  .pp-thumb.contain img{object-fit:contain;padding:6px}
  /* logos letterbox rather than crop, so they're never cut off */
  .spon{position:relative}
  .pp-thumb span{font-size:10.5px;color:var(--ink-soft);text-align:center;padding:4px}
  .or-line{display:flex;align-items:center;gap:10px;margin:12px 0 8px;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em}
  .or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--line)}
  .frame-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .frame{width:172px;height:172px;border-radius:10px;overflow:hidden;position:relative;flex-shrink:0;
    background:linear-gradient(140deg,var(--navy),var(--navy-2));cursor:grab;touch-action:none;border:1px solid var(--line)}
  .frame.drag{cursor:grabbing}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    max-width:none;max-height:none;pointer-events:none;user-select:none}
  .frame-guide{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to right,transparent calc(50% - .5px),rgba(255,255,255,.35) calc(50% - .5px),rgba(255,255,255,.35) calc(50% + .5px),transparent calc(50% + .5px)),
               linear-gradient(to bottom,transparent calc(50% - .5px),rgba(255,255,255,.35) calc(50% - .5px),rgba(255,255,255,.35) calc(50% + .5px),transparent calc(50% + .5px));
    opacity:0;transition:opacity .15s}
  .frame:hover .frame-guide,.frame.drag .frame-guide{opacity:1}
  .frame-ctl{flex:1;min-width:190px}
  .frame-ctl label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:5px}
  .frame-ctl input[type=range]{width:100%;accent-color:var(--gold);padding:0;margin-bottom:12px}
  .frame-hint{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:10px}
  .nudge{display:grid;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px);gap:4px;margin-bottom:10px}
  .nudge button{border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;color:var(--navy);font-size:13px;line-height:1;padding:0}
  .nudge button:hover{border-color:var(--navy)}
  .nudge .mid{border:none;background:none;cursor:default}
  .ord{display:flex;flex-direction:column;gap:3px;margin-right:10px;flex-shrink:0}
  .ord button{width:26px;height:20px;border:1px solid var(--line);background:var(--paper);border-radius:5px;cursor:pointer;color:var(--navy);font-size:10px;line-height:1;padding:0}
  .ord button:hover:not(:disabled){border-color:var(--navy);background:var(--white)}
  .ord button:disabled{opacity:.3;cursor:default}
  .m-links a{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:.15s}
  .m-links a:hover{border-color:var(--navy);color:var(--navy);background:var(--paper)}
  .m-links svg{width:15px;height:15px;fill:currentColor}

  /* ---- events list ---- */
  .event{display:grid;grid-template-columns:88px 1fr;gap:20px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px;transition:.15s}
  .event:hover{box-shadow:var(--shadow)}
  .event.past{opacity:.62}
  .event .date{text-align:center;border-right:1px solid var(--line);padding-right:16px}
  .event .date b{font-family:'Fraunces',serif;font-size:26px;color:var(--navy);display:block;line-height:1}
  .event .date small{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep)}
  .event .body b{font-size:17px;color:var(--navy);display:block;margin-bottom:3px}
  .event .body p{font-size:14px;color:var(--ink-soft)}
  .event .body .where{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:7px}
  .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--paper-2);color:var(--ink-soft);margin-left:8px;vertical-align:middle}
  .pill.next{background:var(--gold);color:var(--navy)}
  .pill.type{background:var(--navy);color:var(--paper)}
  /* NOTE: must NOT be named .recap — that class is used by recap cards below
     and its `font:inherit` / padding:0 / display:flex would override the pill. */
  .pill-recap{background:var(--gold-deep);color:var(--white);cursor:pointer;border:none;
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.06em;
    text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-left:8px;
    display:inline-block;vertical-align:middle;line-height:1.5}
  .pill-recap:hover{background:var(--gold);color:var(--navy)}
  .pill-cal{background:none;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.06em;
    text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-left:8px;
    display:inline-block;vertical-align:middle;line-height:1.5}
  .pill-cal:hover{border-color:var(--navy);color:var(--navy);background:var(--white)}

  /* ---- calendar ---- */
  .view-toggle{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .view-toggle button{font:inherit;font-size:13px;font-weight:600;padding:7px 15px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--ink-soft)}
  .view-toggle button.on{background:var(--white);color:var(--navy);box-shadow:0 1px 2px rgba(10,35,66,.1)}
  .cal{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:26px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .cal-head b{font-family:'Fraunces',serif;font-size:19px;color:var(--navy)}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{width:32px;height:32px;border:1px solid var(--line);background:var(--paper);border-radius:7px;cursor:pointer;color:var(--navy);font-size:15px;line-height:1}
  .cal-nav button:hover{border-color:var(--navy)}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--paper-2);border-bottom:1px solid var(--line)}
  .cal-dow span{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:9px 6px;text-align:center;font-weight:500}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-cell{min-height:92px;border-right:1px solid var(--paper-2);border-bottom:1px solid var(--paper-2);padding:7px 8px}
  .cal-cell:nth-child(7n){border-right:none}
  .cal-cell.dim{background:var(--paper);opacity:.5}
  .cal-cell.today{background:rgba(255,184,28,.09)}
  .cal-cell .dn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft)}
  .cal-cell.today .dn{color:var(--navy);font-weight:600;background:var(--gold);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
  .cal-ev{display:block;width:100%;text-align:left;font-size:11px;font-weight:500;line-height:1.3;background:var(--navy);color:var(--paper);border:none;border-radius:5px;padding:4px 6px;margin-top:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-ev:hover{background:var(--navy-2)}
  .cal-ev.pastev{background:var(--paper-2);color:var(--ink-soft)}

/* Strip fields that must never appear in a write payload:
   - `id` is `generated always as identity`, so Postgres rejects any attempt to
     set it — this silently killed every edit until it was fixed.
   - keys starting with `_` are internal scratch values, never real columns. */
function payload(row){
  const out={};
  for(const k in row){
    if(k==="id"||k.startsWith("_")) continue;
    out[k]=row[k];
  }
  return out;
}

/* ---- auth ----

function useAuth(){
  const [session,setSession]=useState(null);

  useEffect(()=>{

    });
    const {data}=sb.auth.onAuthStateChange((_e,s)=>{ if(alive) setSession(s); });
    return ()=>{ alive=false; data?.subscription?.unsubscribe(); };
  },[]);
  return {session,ready};
}

/* ---- data hook ---- */
function useTable(table, seed, orderBy, opts){
  const [rows,setRows]=useState(seed);
  const [err,setErr]=useState("");
  const skipFetch=opts&&opts.fetch===false;
  /* reloadKey re-runs the fetch when it changes. The admin panel passes the
     signed-in user id, because the panel mounts while the login screen is up —
     so the first fetch goes out anonymously and `signups` (which has no anon
     SELECT) fails. Without this the Mailing List tab stays empty after login. */
  const reloadKey=opts&&opts.reloadKey;
  useEffect(()=>{
    if(!LIVE||skipFetch) return;
    let alive=true;
    (async()=>{
      try{
        let q=sb.from(table).select("*");
        if(orderBy) q=q.order(orderBy);
        const {data,error}=await q;
        if(error) throw error;
        if(alive&&data){ setRows(data); setErr(""); }
      }catch(e){
        console.error("load "+table+" failed:",e);
        if(alive) setErr(e.message||"Could not load "+table);
      }
    })();
    return ()=>{alive=false};
  },[reloadKey]);
  return {
    rows, err,
    async add(row){
      if(LIVE){
        if(skipFetch){
          /* Public pages (the Join form and #subscribe) may INSERT but not
             SELECT — that's what keeps the mailing list private. Asking for the
             row back with .select() needs SELECT permission and would fail, so
             insert without a returning clause and track it locally. */
          const {error}=await sb.from(table).insert(payload(row));
          if(error){
            console.error("insert failed:",error);
            setErr(error.message); return false;
          }
          setRows(r=>[...r,{...payload(row),id:Date.now()+Math.random()}]);
          setErr("");
          return true;
        }
        const {data,error}=await sb.from(table).insert(payload(row)).select();
        if(error){
          console.error("insert failed:",error);
          setErr(error.message); return false;
        }
        if(data){ setRows(r=>[...r,...data]); setErr(""); }
      } else setRows(r=>[...r,{...row,id:Date.now()+Math.random()}]);
      return true;
    },
    async addMany(list){
      if(!list.length) return true;
      if(LIVE){
        const {data,error}=await sb.from(table).insert(list.map(payload)).select();
        if(error) console.error("bulk insert failed:",error);
        if(error){setErr(error.message);return false;}
        if(data) setRows(r=>[...r,...data]);
      } else setRows(r=>[...r,...list.map(x=>({...x,id:Date.now()+Math.random()}))]);
      return true;
    },
    async update(id,row){
      if(LIVE){
        const {error}=await sb.from(table).update(payload(row)).eq("id",id);
        if(error){setErr(error.message);return false;}
        setErr("");
      }
      setRows(r=>r.map(x=>x.id===id?{...x,...payload(row)}:x));
      return true;
    },
    async remove(id){
      if(LIVE){
        const {error}=await sb.from(table).delete().eq("id",id);
        if(error){setErr(error.message);return false;}
      }
      setRows(r=>r.filter(x=>x.id!==id));
      return true;
    },
  };
}

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDate=(iso)=>{
  const d=new Date(iso+"T00:00:00");
  return {mon:MON[d.getMonth()],day:d.getDate(),
    full:d.toLocaleString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}),
    short:d.toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric"}),d};
};
const todayISO=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`};
const isPast=(iso)=>iso<todayISO();
const initials=(n)=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const splitList=(s)=>(s||"").split(/[,;|]/).map(x=>x.trim()).filter(Boolean);

/* Strict majors parser, used on CSV import so the page never ends up with
   "Finance & Accounting" next to "Accounting and Finance". Splits on commas,
   semicolons, pipes, ampersands and the word "and", matches case-insensitively
   against MAJORS, de-dupes, and reports anything it couldn't match. */
function parseMajors(raw){
  const parts=(raw||"").split(/\s*(?:[,;|&]|\band\b)\s*/i).map(x=>x.trim()).filter(Boolean);
  const kept=[],unknown=[];
  parts.forEach(p=>{
    const hit=MAJORS.find(m=>m.toLowerCase()===p.toLowerCase());
    if(hit){ if(!kept.includes(hit)) kept.push(hit); }
    else unknown.push(p);
  });
  return {majors:kept.join(", "),unknown};
}

function currentTerm(now=new Date()){

  if(m<=4) return {label:`Spring ${y}`, start:`${y}-01-01`, end:`${y}-05-31`};
  return {label:`Fall ${y}`, start:`${y}-08-01`, end:`${y}-12-31`};
}

/* ---- times ---- */
const DEFAULT_TIME="19:00";
const normTime=(t)=>{
  const s=String(t||"").trim();
  const m=s.match(/^(\d{1,2}):?(\d{2})?\s*([ap]\.?m\.?)?$/i);
  if(!m) return DEFAULT_TIME;
  let h=parseInt(m[1],10); const mi=m[2]?parseInt(m[2],10):0;
  const ap=(m[3]||"").toLowerCase();
  if(ap.startsWith("p")&&h<12) h+=12;
  if(ap.startsWith("a")&&h===12) h=0;
  if(h>23||mi>59) return DEFAULT_TIME;
  return `${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`;
};
const fmtTime=(t)=>{
  const [h,mi]=normTime(t).split(":").map(Number);
  const ap=h<12?"AM":"PM"; const h12=h%12===0?12:h%12;
  return `${h12}:${String(mi).padStart(2,"0")} ${ap}`;
};
const addHour=(t,n)=>{
  const [h,mi]=normTime(t).split(":").map(Number);
  return `${String((h+n)%24).padStart(2,"0")}:${String(mi).padStart(2,"0")}`;
};
const mins=(t)=>{const [h,m]=normTime(t).split(":").map(Number);return h*60+m};
/* End time: use what's stored; fall back to start + 1h. */
const endOf=(e)=>{
  const st=normTime(e.time);
  const raw=String(e.end_time||"").trim();
  if(!raw) return addHour(st,1);
  const en=normTime(raw);
  return en===st ? addHour(st,1) : en;
};
/* True when the end time is earlier than the start, i.e. it runs past midnight
   and DTEND needs to land on the following day. */
const spansMidnight=(e)=>mins(endOf(e))<mins(normTime(e.time));
const nextDay=(iso)=>{
  const d=new Date(iso+"T12:00:00");
  d.setDate(d.getDate()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtRange=(e)=>`${fmtTime(e.time)} – ${fmtTime(endOf(e))}`;

/* ---- ICS (calendar) ----
   Times are emitted as "floating" local time (no Z, no TZID). For a club where
   everyone is in one timezone that's the safest choice — it sidesteps DST
   conversion bugs entirely and shows 7:00 PM on every attendee's calendar. */
const icsEsc=(s)=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
const icsStamp=(iso,time)=>`${iso.replace(/-/g,"")}T${normTime(time).replace(":","")}00`;
function icsFold(line){
  // RFC 5545: lines must be <= 75 octets; continuation lines start with a space
  const out=[]; let s=line;
  while(s.length>73){ out.push(s.slice(0,73)); s=" "+s.slice(73); }
  out.push(s); return out.join("\r\n");
}
function icsForEvents(list,calName){
  const now=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const body=list.map(e=>{
    const t=normTime(e.time);
    const parts=[
      "BEGIN:VEVENT",
      // Stable per event, deliberately NOT including the date: calendar apps
      // match on UID, so a date change must update the same entry rather than
      // create a second one.
      `UID:upaa-${e.id}@pittupaa`,
      `DTSTAMP:${now}`,
      `DTSTART:${icsStamp(e.date,t)}`,
      `DTEND:${icsStamp(spansMidnight(e)?nextDay(e.date):e.date,endOf(e))}`,
      `SUMMARY:${icsEsc(e.title)}`,
      e.location?`LOCATION:${icsEsc(e.location)}`:null,
      e.desc?`DESCRIPTION:${icsEsc(e.desc)}`:null,
      e.type?`CATEGORIES:${icsEsc(e.type)}`:null,
      "END:VEVENT",
    ].filter(Boolean);
    return parts.map(icsFold).join("\r\n");
  }).join("\r\n");
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//UPAA//Website//EN",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH",
    icsFold(`X-WR-CALNAME:${icsEsc(calName||"UPAA Events")}`),
    "X-WR-TIMEZONE:America/New_York",
    body,"END:VCALENDAR",
  ].filter(Boolean).join("\r\n")+"\r\n";
}
function downloadICS(name,text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/calendar;charset=utf-8"}));
  a.download=name; a.click();
}
function googleCalUrl(e){
  const t=normTime(e.time);
  const p=new URLSearchParams({
    action:"TEMPLATE", text:e.title||"UPAA Event",
    dates:`${icsStamp(e.date,t)}/${icsStamp(spansMidnight(e)?nextDay(e.date):e.date,endOf(e))}`,
    details:e.desc||"", location:e.location||"", ctz:"America/New_York",
  });
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

function CalendarPicker({events,onClose}){

     correctly reads the value as an .ics feed to subscribe to. Google fetches
     over https regardless, so nothing is actually sent unencrypted. Left
     unencoded because that is the form Google accepts. */
  const googleFeedUrl=`https://calendar.google.com/calendar/u/0/r?cid=${feed.replace(/^https:/,"http:")}`;
  const dl=()=>{ downloadICS("upaa-events.ics",icsForEvents(events,"UPAA Events")); onClose(); };

  const Opt=({icon,title,sub,href,onClick})=>{

      <span className="ico">{icon}</span>

      <span className="arrow">→</span>
    </>);

      ? <a className="cal-opt" href={href} target="_blank" rel="noopener noreferrer" onClick={onClose}>{inner}</a>
      : <button className="cal-opt" onClick={onClick}>{inner}</button>;

     cid= parameter expects a Google calendar ID, not a feed URL, and passing

/* ============================================================
   RICH TEXT — a small Markdown subset, rendered to React elements
   ------------------------------------------------------------
   Deliberately not HTML: nothing an author types can inject markup, and the
   link pattern only ever matches http(s), so no javascript: URLs are possible.
   ============================================================ */
const INLINE_RX=/(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*)|(\[[^\]\n]+\]\((https?:\/\/[^\s)]+)\))|((?:https?:\/\/|www\.)[^\s<)]+)/;
function inlineBits(s){
  const out=[]; let rest=String(s??""), k=0;
  for(;;){
    const m=INLINE_RX.exec(rest);
    if(!m){ if(rest) out.push(rest); break; }
    if(m.index>0) out.push(rest.slice(0,m.index));
    const tok=m[0];
    if(m[1])      out.push(<strong key={k++}>{tok.slice(2,-2)}</strong>);
    else if(m[2]) out.push(<em key={k++}>{tok.slice(1,-1)}</em>);
    else if(m[3]) out.push(<a key={k++} className="rt-a" href={m[4]} target="_blank"
                     rel="noopener noreferrer">{tok.slice(1,tok.indexOf("]"))}</a>);
    else {
      const href=tok.startsWith("http")?tok:"https://"+tok;
      out.push(<a key={k++} className="rt-a" href={href} target="_blank"
                 rel="noopener noreferrer">{tok.replace(/^https?:\/\//,"")}</a>);
    }
    rest=rest.slice(m.index+tok.length);
  }
  return out;
}
function RichText({text}){
  /* Line-based rather than block-based: people write a heading directly above a
     list with no blank line between, and that must still parse correctly. */
  const lines=String(text??"").split(/\n/);
  const out=[]; let i=0, k=0;
  const isUl=(l)=>/^\s*[-*+]\s+/.test(l);
  const isOl=(l)=>/^\s*\d+[.)]\s+/.test(l);
  const isQ=(l)=>/^\s*>\s?/.test(l);
  const isH=(l)=>/^#{2,3}\s/.test(l);
  const plain=(l)=>l.trim()&&!isUl(l)&&!isOl(l)&&!isQ(l)&&!isH(l);
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){ i++; continue; }
    if(isH(l)){
      const lvl=l.match(/^#+/)[0].length>=3?3:2;
      out.push(<div key={k++} className={"rt-h"+lvl}>{inlineBits(l.replace(/^#+\s*/,""))}</div>);
      i++; continue;
    }
    if(isUl(l)){
      const items=[];
      while(i<lines.length&&isUl(lines[i])) items.push(lines[i++].replace(/^\s*[-*+]\s+/,""));
      out.push(<ul key={k++} className="rt-ul">{items.map((t,j)=>
        <li key={j}>{inlineBits(t)}</li>)}</ul>);
      continue;
    }
    if(isOl(l)){
      const items=[];
      while(i<lines.length&&isOl(lines[i])) items.push(lines[i++].replace(/^\s*\d+[.)]\s+/,""));
      out.push(<ol key={k++} className="rt-ol">{items.map((t,j)=>
        <li key={j}>{inlineBits(t)}</li>)}</ol>);
      continue;
    }
    if(isQ(l)){
      const parts=[];
      while(i<lines.length&&isQ(lines[i])) parts.push(lines[i++].replace(/^\s*>\s?/,""));
      out.push(<blockquote key={k++} className="rt-q">{inlineBits(parts.join(" "))}</blockquote>);
      continue;
    }
    const para=[];
    while(i<lines.length&&plain(lines[i])) para.push(lines[i++].trim());
    out.push(<p key={k++}>{inlineBits(para.join(" "))}</p>);
  }
  return out;
}

/* ---- attachments: one per line, stored as "filename|url" ---- */
function parseFiles(s){
  return String(s??"").split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.lastIndexOf("|");
    return i<0 ? {name:(l.split("/").pop()||"file"), url:l}
               : {name:l.slice(0,i).trim(), url:l.slice(i+1).trim()};
  }).filter(f=>/^https?:\/\//.test(f.url));
}
const serializeFiles=(list)=>list.map(f=>`${f.name}|${f.url}`).join("\n");
const fileExt=(name)=>{
  const m=/\.([A-Za-z0-9]{1,5})$/.exec(name||"");
  return (m?m[1]:"FILE").toUpperCase().slice(0,5);
};
function Attachments({value}){
  const files=parseFiles(value);
  if(!files.length) return null;
  return(<div className="att-list">{files.map((f,i)=>(
    <a className="att-item" key={i} href={f.url} target="_blank" rel="noopener noreferrer">
      <span className="ext">{fileExt(f.name)}</span>
      <span className="nm">{f.name}</span>
      <span className="dl">OPEN ↗</span>
    </a>))}</div>);
}

/* ============================================================
   IMAGE UPLOADS  (Supabase Storage)
   ============================================================ */
const BUCKET = "uploads";

/* Downscale + compress before upload. Phone headshots are 3-5MB; this gets
   them under ~150KB, which keeps the page fast and storage well inside the
   free tier. SVGs pass through untouched; logos keep their alpha channel. */
async function shrinkImage(file, maxPx, keepAlpha){
  if(file.type==="image/svg+xml") return file;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{
      const i=new Image();
      i.onload=()=>res(i);
      i.onerror=()=>rej(new Error("That file isn't a readable image."));
      i.src=url;
    });
    const s=Math.min(1, maxPx/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const ctx=c.getContext("2d");
    if(!keepAlpha){ ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); }
    ctx.drawImage(img,0,0,w,h);
    const type=keepAlpha?"image/png":"image/jpeg";
    const blob=await new Promise(r=>c.toBlob(r,type,keepAlpha?undefined:0.86));
    if(!blob) throw new Error("Couldn't process that image.");
    const base=file.name.replace(/\.[^.]+$/,"").replace(/[^a-zA-Z0-9-_]/g,"-").slice(0,40)||"image";
    return new File([blob], base+(keepAlpha?".png":".jpg"), {type});
  } finally { URL.revokeObjectURL(url); }
}

async function uploadImage(file, folder, keepAlpha){
  if(!file.type.startsWith("image/")) throw new Error("Please choose an image file.");
  if(file.size>15*1024*1024) throw new Error("That image is over 15MB — try a smaller one.");
  const small=await shrinkImage(file, keepAlpha?800:1000, keepAlpha);
  if(!LIVE) return {url:URL.createObjectURL(small), demo:true};
  const ext=(small.name.split(".").pop()||"jpg").toLowerCase();
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path, small, {contentType:small.type,upsert:false});
  if(error) throw new Error(error.message.includes("Bucket not found")
    ? `Storage bucket "${BUCKET}" doesn't exist yet — see the Storage setup step in the README.`
    : error.message);
  const {data}=sb.storage.from(BUCKET).getPublicUrl(path);
  return {url:data.publicUrl};
}

/* Any file type, no image processing — slide decks, PDFs, handouts. */
async function uploadFile(file, folder){
  if(file.size>25*1024*1024) throw new Error("That file is over 25MB — try compressing it first.");
  const safe=(file.name||"file").replace(/[^A-Za-z0-9._-]/g,"-").slice(-60);
  if(!LIVE) return {url:URL.createObjectURL(file), name:file.name||safe, demo:true};
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,6)}-${safe}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,
    {contentType:file.type||"application/octet-stream",upsert:false});
  if(error) throw new Error(error.message.includes("Bucket not found")
    ? `Storage bucket "${BUCKET}" doesn't exist yet — see the README.` : error.message);
  const {data}=sb.storage.from(BUCKET).getPublicUrl(path);
  return {url:data.publicUrl, name:file.name||safe};
}

/* Upload-or-paste field. Drag a file on, click to browse, or paste a URL. */
function PhotoPicker({value,onChange,folder,keepAlpha,label,hint,contain}){
  const ref=useRef();
  const [busy,setBusy]=useState(false);
  const [over,setOver]=useState(false);
  const [err,setErr]=useState("");
  const take=async(file)=>{
    if(!file) return;
    setErr(""); setBusy(true);
    try{
      const {url,demo}=await uploadImage(file,folder,keepAlpha);
      onChange(url);
      if(demo) setErr("Uploaded for preview only — connect Supabase Storage to save it permanently.");
    }catch(e){ setErr(e.message||"Upload failed."); }
    setBusy(false);
  };
  return(<div className="field">
    <label>{label} <span className="opt">(optional)</span></label>
    <div className="pp-row">
      <div className={"pp-thumb"+(contain?" contain":"")}>
        {value?<img src={value} alt=""/>:<span>no image</span>}
      </div>
      <div style={{flex:1}}>
        <div className={"drop"+(over?" over":"")+(busy?" busy":"")}
          onClick={()=>!busy&&ref.current.click()}
          onDragOver={e=>{e.preventDefault();setOver(true)}}
          onDragLeave={()=>setOver(false)}
          onDrop={e=>{e.preventDefault();setOver(false);take(e.dataTransfer.files?.[0])}}>
          <b>{busy?"Uploading…":"Drop an image here, or click to choose"}</b>
          <small>{keepAlpha?"PNG or SVG with a transparent background works best":"JPG or PNG · resized automatically"}</small>
        </div>
        <input ref={ref} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>{take(e.target.files?.[0]); e.target.value=""}}/>
      </div>
    </div>
    {err&&<div className="hint" style={{color:"var(--danger)"}}>{err}</div>}
    <div className="or-line">or paste a link</div>
    <input value={value||""} onChange={e=>onChange(e.target.value)} placeholder="https://..."/>
    {hint&&<div className="hint">{hint}</div>}
    {value&&<button type="button" className="mini del" style={{marginTop:8}} onClick={()=>onChange("")}>Remove image</button>}
  </div>);
}

/* Drag-to-frame editor: sets the focal point and zoom for a square crop. */
const parsePos=(s)=>{
  const [x,y]=String(s||"50 50").split(/\s+/).map(Number);
  return {x:Number.isFinite(x)?x:50, y:Number.isFinite(y)?y:50};
};
const posCSS=(s)=>{const p=parsePos(s);return `${p.x}% ${p.y}%`};
const zoomNum=(z)=>{const n=parseFloat(z);return Number.isFinite(n)&&n>=1?Math.min(n,3):1};

function HeadshotFramer({photo,pos,zoom,onChange}){
  const box=useRef();
  const [drag,setDrag]=useState(false);
  const p=parsePos(pos), z=zoomNum(zoom);
  const clamp=(v)=>Math.max(0,Math.min(100,v));
  const move=(dx,dy)=>{
    const r=box.current?.getBoundingClientRect();
    const w=r?.width||172, h=r?.height||172;
    onChange({pos:`${Math.round(clamp(p.x-dx/w*100))} ${Math.round(clamp(p.y-dy/h*100))}`});
  };
  const start=(e)=>{
    if(!photo) return;
    e.preventDefault();
    setDrag(true);
    let lx=e.clientX, ly=e.clientY;
    const el=box.current;
    const onMove=(ev)=>{
      const cx=ev.clientX, cy=ev.clientY;
      move(cx-lx, cy-ly); lx=cx; ly=cy;
    };
    const onUp=()=>{
      setDrag(false);
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
    };
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
  };
  const nudge=(dx,dy)=>onChange({pos:`${clamp(p.x+dx)} ${clamp(p.y+dy)}`});
  if(!photo) return null;
  return(<div className="field">
    <label>Framing</label>
    <div className="frame-wrap">
      <div ref={box} className={"frame"+(drag?" drag":"")} onPointerDown={start}>
        <img src={photo} alt="" draggable="false"
          style={{objectPosition:`${p.x}% ${p.y}%`,transform:`scale(${z})`,transformOrigin:`${p.x}% ${p.y}%`}}/>
        <div className="frame-guide"></div>
      </div>
      <div className="frame-ctl">
        <div className="frame-hint">Drag the photo to center the face. This is exactly how the card will crop it.</div>
        <label>Zoom · {z.toFixed(2)}×</label>
        <input type="range" min="1" max="2.5" step="0.05" value={z}
          onChange={e=>onChange({zoom:e.target.value})}/>
        <div className="nudge">
          <button type="button" onClick={()=>nudge(-4,-4)} aria-label="Up left">↖</button>
          <button type="button" onClick={()=>nudge(0,-4)} aria-label="Up">↑</button>
          <button type="button" onClick={()=>nudge(4,-4)} aria-label="Up right">↗</button>
          <button type="button" onClick={()=>nudge(-4,0)} aria-label="Left">←</button>
          <span className="mid"></span>
          <button type="button" onClick={()=>nudge(4,0)} aria-label="Right">→</button>
          <button type="button" onClick={()=>nudge(-4,4)} aria-label="Down left">↙</button>
          <button type="button" onClick={()=>nudge(0,4)} aria-label="Down">↓</button>
          <button type="button" onClick={()=>nudge(4,4)} aria-label="Down right">↘</button>
        </div>
        <button type="button" className="mini" onClick={()=>onChange({pos:"50 50",zoom:"1"})}>Reset framing</button>
      </div>
    </div>
  </div>);
}

    build:(g)=>({title:g("title"),url:g("url"),
      category:LINK_CATS.find(c=>c.toLowerCase()===g("category").toLowerCase())||"Other",
      desc:g("desc"),order:+(g("order")||99)||99}),
    valid:(r)=>!!r.title,

    out:(r)=>[r.title,r.url||"",r.category||"Other",r.desc||"",r.order??""],

      ["Mason Gallardo","mag123@pitt.edu","Sophomore","Accounting","active","tabling","2026-08-23"],

    ],
    notes:"Only email is required — a blank name is fine. status: active or unsubscribed (defaults to active). created: YYYY-MM-DD, or leave blank for today. Duplicate emails are skipped on import.",
    build:(g)=>({name:g("name"),email:g("email"),year:g("year"),major:g("major"),
      status:g("status")==="unsubscribed"?"unsubscribed":"active",
      source:g("source")||"import",created:/^\d{4}-\d{2}-\d{2}$/.test(g("created"))?g("created"):todayISO()}),
    valid:(r)=>r.email&&r.email.includes("@"),

function toCSV(head, rows){
  const esc=v=>`"${(v??"").toString().replace(/"/g,'""')}"`;
  return [head.map(esc).join(","),...rows.map(r=>r.map(esc).join(","))].join("\r\n");
}
function download(name, text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"}));
  a.download=name;a.click();
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(c==='"'){q=false;}
      else cell+=c;
    } else {
      if(c==='"') q=true;
      else if(c===","){row.push(cell);cell="";}
      else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
      else if(c!=="\r") cell+=c;
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta);return ok;
  }
}

/* Reusable CSV toolbar: Template / Export / Import for any table */
function CsvBar({specKey,t,say}){
  const spec=CSV[specKey];
  const fileRef=useRef();
  const [imp,setImp]=useState(null);

  const template=()=>{
    download(spec.file+"-template.csv", toCSV(spec.cols, spec.sample));
    say&&say("Template downloaded");
  };
  const exportAll=()=>{
    if(!t.rows.length){ say&&say("Nothing to export yet"); return; }
    download(spec.file+".csv", toCSV(spec.cols, t.rows.map(spec.out)));
  };
  const onFile=async(ev)=>{
    const file=ev.target.files?.[0]; if(!file) return;
    let rows;
    try{ rows=parseCSV(await file.text()); }
    catch(e){ setImp({error:"Couldn't read that file. Make sure it's saved as CSV."}); return; }
    ev.target.value="";
    if(rows.length<2){ setImp({error:"That file has a header row but no data rows."}); return; }
    const head=rows[0].map(h=>h.trim().toLowerCase().replace(/^\uFEFF/,""));
    const missing=spec.required.filter(c=>!head.includes(c));
    if(missing.length){
      setImp({error:`Missing required column${missing.length>1?"s":""}: ${missing.join(", ")}. Download the template to see the expected format.`});
      return;
    }
    const seen=new Set(spec.dedupeOn?t.rows.map(r=>(r[spec.dedupeOn]||"").toLowerCase()):[]);
    const good=[],bad=[],warn=new Set();
    rows.slice(1).forEach((r,i)=>{
      const g=(c)=>{const k=head.indexOf(c);return k>=0?(r[k]||"").trim():""};
      const built=spec.build(g);
      if(!spec.valid(built)){ bad.push(i+2); return; }
      if(spec.dedupeOn){
        const key=(built[spec.dedupeOn]||"").toLowerCase();
        if(seen.has(key)) return;
        seen.add(key);
      }
      if(built._unknown&&built._unknown.length) built._unknown.forEach(u=>warn.add(u));
      delete built._unknown;
      good.push(built);
    });
    if(!good.length){ setImp({error:"No valid rows found."+(bad.length?` Check row${bad.length>1?"s":""} ${bad.slice(0,6).join(", ")}.`:"")+" "+spec.notes}); return; }
    setImp({rows:good,skipped:bad.length,warn:[...warn]});
  };
  const doImport=async(replace)=>{
    if(replace){ for(const r of t.rows.slice()) await t.remove(r.id); }
    const ok=await t.addMany(imp.rows);
    if(ok===false){
      // Keep the modal open and say so — silently closing looks like success.
      setImp({error:"The database rejected the import. The exact message is in the red banner above this panel — it usually means a column from the CSV doesn't exist in the table yet, which the README migration fixes."});
      return;
    }
    say&&say(`${replace?"Replaced with":"Added"} ${imp.rows.length} row${imp.rows.length===1?"":"s"}`);
    setImp(null);
  };

  return(<>
    <button className="mini" onClick={template}>Template</button>
    <button className="mini" onClick={exportAll}>Export</button>
    <button className="mini" onClick={()=>fileRef.current.click()}>Import</button>
    <input ref={fileRef} type="file" accept=".csv,text/csv" style={{display:"none"}} onChange={onFile}/>
    {imp&&<Modal title={imp.error?"Import problem":"Confirm import"} onClose={()=>setImp(null)}>
      {imp.error
        ? <><p style={{fontSize:14,color:"var(--danger)",marginBottom:10}}>{imp.error}</p>
            <div className="cols">Expected columns: {spec.cols.join(", ")}</div>
            <div className="modal-acts">
              <button className="mini" onClick={()=>{template();setImp(null)}}>Download template</button>
              <button className="btn btn-primary" onClick={()=>setImp(null)}>Close</button></div></>
        : <><p style={{fontSize:14,color:"var(--ink-soft)",marginBottom:14}}>
              Found <b>{imp.rows.length}</b> valid row{imp.rows.length===1?"":"s"}
              {imp.skipped?<> · <span style={{color:"var(--danger)"}}>{imp.skipped} skipped</span></>:null}
              {spec.dedupeOn?" · duplicates skipped":""}.</p>
            <div style={{maxHeight:200,overflow:"auto",border:"1px solid var(--line)",borderRadius:8,marginBottom:14}}>
              {imp.rows.map((r,i)=><div key={i} style={{padding:"9px 12px",borderBottom:"1px solid var(--paper-2)",fontSize:13,color:"var(--navy)"}}>{spec.label(r)}</div>)}
            </div>
            {imp.warn&&imp.warn.length>0&&<div className="banner" style={{marginBottom:14}}><span>⚠️</span><div>
              <b>Dropped {imp.warn.length} unrecognized major{imp.warn.length>1?"s":""}:</b> {imp.warn.join(", ")}.
              Majors have to match the standard list exactly. Either fix the spelling in your file, or add the option to the <b>MAJORS</b> list at the top of index.html.
            </div></div>}
            <div className="modal-acts">
              <button className="mini" onClick={()=>setImp(null)}>Cancel</button>
              <button className="mini" onClick={()=>doImport(false)}>Add to existing</button>
              <button className="btn btn-primary" onClick={()=>window.confirm(`Delete all ${t.rows.length} current row(s) and replace with these ${imp.rows.length}?`)&&doImport(true)}>Replace all</button>
            </div></>}
    </Modal>}
  </>);
}

function Calendar({events}){
  const firstUpcoming=events.find(e=>!isPast(e.date));
  const anchor=firstUpcoming? new Date(firstUpcoming.date+"T00:00:00") : new Date();
  const [cur,setCur]=useState({y:anchor.getFullYear(),m:anchor.getMonth()});
  const [sel,setSel]=useState(null);
  const byDate=useMemo(()=>{const map={};events.forEach(e=>{(map[e.date]=map[e.date]||[]).push(e)});return map;},[events]);
  const shift=(n)=>setCur(c=>{const d=new Date(c.y,c.m+n,1);return {y:d.getFullYear(),m:d.getMonth()}});
  const first=new Date(cur.y,cur.m,1);
  const startPad=first.getDay();
  const daysInMonth=new Date(cur.y,cur.m+1,0).getDate();
  const daysPrev=new Date(cur.y,cur.m,0).getDate();
  const cells=[];
  for(let i=startPad-1;i>=0;i--) cells.push({day:daysPrev-i,dim:true});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,dim:false});
  let next=1; while(cells.length%7!==0) cells.push({day:next++,dim:true});
  const iso=(d)=>`${cur.y}-${String(cur.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const today=todayISO();
  return(<>
    <div className="cal">
      <div className="cal-head">
        <b>{MONF[cur.m]} {cur.y}</b>
        <div className="cal-nav">
          <button onClick={()=>shift(-1)} aria-label="Previous month">‹</button>
          <button onClick={()=>setCur({y:new Date().getFullYear(),m:new Date().getMonth()})} style={{width:"auto",padding:"0 11px",fontSize:12,fontWeight:600}}>Today</button>
          <button onClick={()=>shift(1)} aria-label="Next month">›</button>
        </div>
      </div>
      <div className="cal-dow">{["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><span key={d}>{d}</span>)}</div>
      <div className="cal-grid">
        {cells.map((c,i)=>{

/* Sign-in screen. Real Supabase accounts when connected; a shared password
   only in demo mode, where there's no auth server to talk to. */
function Login({toSite,onDemo}){
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);

  const submit=async()=>{
    setErr("");
    if(!LIVE){
      pw===DEMO_PASSWORD ? onDemo() : setErr("Incorrect password.");
      return;
    }
    if(!email.trim()||!pw){ setErr("Enter your email and password."); return; }
    setBusy(true);
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
    setBusy(false);
    if(error){
      setErr(/invalid login/i.test(error.message)
        ? "That email and password don't match. Check for typos, or ask Conner to reset it."
        : error.message);
    }
  };

  return(<div className="admin-wrap"><div className="login-box">
    <h2 className="serif">E-Board Login</h2>
    <p>{LIVE
      ? "Sign in with the account you were given. Each E-Board member has their own."
      : "Demo mode — enter the shared password to try the panel."}</p>
    {LIVE&&<div className="field"><label htmlFor="ad-e">Email</label>
      <input id="ad-e" type="email" autoComplete="username" inputMode="email" autoCapitalize="off"
        value={email} autoFocus onChange={e=>{setEmail(e.target.value);setErr("")}}
        onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="abc123@pitt.edu"/></div>}
    <div className="field"><label htmlFor="ad-p">Password</label>
      <input id="ad-p" type="password" autoComplete="current-password"
        value={pw} autoFocus={!LIVE} onChange={e=>{setPw(e.target.value);setErr("")}}
        onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••"/></div>
    {err&&<p style={{color:"var(--danger)",fontSize:13,marginBottom:12}}>{err}</p>}
    <button className="btn btn-primary" style={{width:"100%",justifyContent:"center"}}
      disabled={busy} onClick={submit}>{busy?"Signing in…":"Sign in"}</button>
    {LIVE&&<div className="hint" style={{marginTop:12}}>
      Forgotten it? Ask Conner — passwords are reset from the Supabase dashboard.</div>}
    <button className="mini" style={{width:"100%",marginTop:12}} onClick={toSite}>← Back to site</button>
  </div></div>);
}

  const [demoAuthed,setDemoAuthed]=useState(false);

  const [tab,setTab]=useState("events");
  const [toast,setToast]=useState("");
  const say=(m)=>{setToast(m);setTimeout(()=>setToast(""),2200)};
  // refetch once the session is known — see the reloadKey note in useTable

  const members=useTable("members",SEED.members,"order",{reloadKey:rk});

    <p style={{margin:0,color:"var(--ink-soft)",fontSize:14}}>Checking your session…</p></div></div>);

/* Shows any database error for a table. Without this a rejected write looks
   exactly like nothing happening, which is the worst possible failure mode. */
function ErrBar({t,name}){
  if(!t.err) return null;
  const missing=/column\s+\S*?\.?(\w+)\s+does not exist/i.exec(t.err)
    || /Could not find the '(\w+)' column/i.exec(t.err);
  const rls=/row-level security|permission denied|JWT|not authorized/i.test(t.err);
  return(<div className="err-banner">
    <b>The database rejected that.</b> {name?`(${name})`:""} <code>{t.err}</code>
    {rls&&<div style={{marginTop:8}}>
      This usually means your sign-in expired. Log out and back in, then try again.
    </div>}
    {missing&&<div style={{marginTop:8}}>
      It looks like the <code>{missing[1]}</code> column doesn't exist yet. Run the migration
      from the README in Supabase → SQL Editor, then reload this page:
      <div style={{marginTop:6}}><code>{`alter table ${name||"<table>"} add column if not exists ${missing[1]} text default '';`}</code></div>
    </div>}
  </div>);
}
function Toast({msg}){return msg?<div className="toast">{msg}</div>:null;}

function EventAdmin({t,stats,say}){
  const [edit,setEdit]=useState(null);
  const sorted=t.rows.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const save=async(e)=>{
    const ok=e.id?await t.update(e.id,e):await t.add(e);
    if(ok!==false) setEdit(null);   // keep the form open if the write failed
  };
  return(<>
    <div className="stat-preview">
      <div className="sp"><b>{stats.meetings}</b><small>events in {stats.term}</small></div>
      <div className="sp"><b>{stats.held}</b><small>already held</small></div>
      <div className="sp"><b>{stats.firms||"—"}</b><small>firms this semester</small></div>
      <div className="sp"><b>{stats.network}</b><small>firms in network</small></div>
    </div>
    <div className="info-box"><b>These numbers are live.</b> The homepage counters are calculated from this list. Fill in the <b>Firm</b> field to count an event toward "firms this semester."</div>
    <ErrBar t={t} name="events"/>
    <div className="panel-head"><h3 className="serif">Events</h3>
      <div className="acts"><CsvBar specKey="events" t={t} say={say}/>
        <button className="mini" onClick={()=>{
          downloadICS("upaa.ics",icsForEvents(t.rows.slice().sort((a,b)=>a.date.localeCompare(b.date)),"UPAA Events"));
          say("Downloaded upaa.ics — commit it to the repo to update subscribers");
        }}>Calendar feed</button>
        <button className="btn btn-primary" onClick={()=>setEdit({title:"",date:"",time:DEFAULT_TIME,end_time:"",type:"Meeting",firm:"",location:CLUB.meetRoom,desc:""})}>+ Add event</button></div></div>
    {sorted.length===0&&<div className="empty">No events yet. Add one, or download the template and import.</div>}
    {sorted.map(e=>(
      <div className="adm-item" key={e.id}>
        <div className="meta"><b>{e.title}</b><small>
          {e.date?fmtDate(e.date).full:"no date"} · {fmtRange(e)} · {e.location}
          {e.type?" · "+e.type:""}{e.firm?" · "+e.firm:""}{isPast(e.date)?" · past":""}</small></div>
        <div className="acts"><button className="mini" onClick={()=>setEdit(e)}>Edit</button>
          <button className="mini del" onClick={()=>window.confirm("Delete this event?")&&t.remove(e.id)}>Delete</button></div>
      </div>))}
    {edit&&<Modal title={edit.id?"Edit event":"Add event"} onClose={()=>setEdit(null)}>
      <EventForm init={edit} onSave={save} onCancel={()=>setEdit(null)}/></Modal>}
  </>);

/* Formatting toolbar over a plain textarea.
   ---------------------------------------------------------------------------
   The stored format is still the same small Markdown subset — this just types
   it for you, so nobody has to remember the syntax. Every button toggles: press
   it on already-formatted text and the formatting comes off.
   ---------------------------------------------------------------------------*/
function MarkdownEditor({value,onChange,placeholder,minHeight}){
  const ref=useRef();
  const text=value||"";

  /* Apply a transform, then put the cursor back where the user expects it.
     Without the rAF the textarea has re-rendered and the selection is lost. */
  const run=(fn)=>{
    const ta=ref.current; if(!ta) return;
    const s=ta.selectionStart, e=ta.selectionEnd;
    const out=fn(text,s,e);
    if(!out) return;
    onChange(out.text);
    requestAnimationFrame(()=>{
      const t=ref.current; if(!t) return;
      t.focus(); t.setSelectionRange(out.selStart,out.selEnd);
    });
  };

  /* ---- inline markers: **bold**, *italic* ---- */
  const wrap=(marker,fallback)=>(t,s,e)=>{
    const m=marker.length;
    const sel=t.slice(s,e), before=t.slice(0,s), after=t.slice(e);
    // markers inside the selection -> strip them
    if(sel.length>=2*m && sel.startsWith(marker) && sel.endsWith(marker)){
      const inner=sel.slice(m,-m);
      return {text:before+inner+after, selStart:s, selEnd:s+inner.length};
    }
    // markers just outside the selection -> strip those instead
    if(before.endsWith(marker) && after.startsWith(marker)){
      return {text:before.slice(0,-m)+sel+after.slice(m), selStart:s-m, selEnd:e-m};
    }
    const body=sel||fallback;
    return {text:before+marker+body+marker+after,
            selStart:s+m, selEnd:s+m+body.length};
  };

  /* ---- line prefixes: headings, lists, quotes ---- */
  const lines=(strip,add)=>(t,s,e)=>{
    const ls=t.lastIndexOf("\n",s-1)+1;
    let le=t.indexOf("\n",e); if(le<0) le=t.length;
    const block=t.slice(ls,le)||"";
    const arr=block.split("\n");
    const on=arr.every(l=>strip.test(l));
    const out=arr.map((l,i)=> on ? l.replace(strip,"") : add(l.replace(/^\s*(#{2,3}\s+|[-*+]\s+|\d+[.)]\s+|>\s?)/,""),i));
    const nb=out.join("\n");
    return {text:t.slice(0,ls)+nb+t.slice(le), selStart:ls, selEnd:ls+nb.length};
  };

  const link=()=>(t,s,e)=>{
    const sel=t.slice(s,e);
    const url=window.prompt("Link address","https://");
    if(!url||url==="https://") return null;
    const label=sel||"link text";
    const md=`[${label}](${url})`;
    return {text:t.slice(0,s)+md+t.slice(e),
            selStart:s+1, selEnd:s+1+label.length};
  };

  const B=[
    ["H2","Heading",        lines(/^##\s+/,        l=>"## "+l)],
    ["H3","Smaller heading",lines(/^###\s+/,       l=>"### "+l)],
    null,
    ["B","Bold",            wrap("**","bold text"), "b"],
    ["I","Italic",          wrap("*","italic text"), "i"],
    ["Link","Insert a link",link()],
    null,
    ["• List","Bulleted list",  lines(/^\s*[-*+]\s+/,  l=>"- "+l)],
    ["1. List","Numbered list", lines(/^\s*\d+[.)]\s+/, (l,i)=>`${i+1}. `+l)],
    ["❝ Quote","Pull quote",    lines(/^\s*>\s?/,      l=>"> "+l)],
  ];

  const onKey=(ev)=>{
    if(!(ev.metaKey||ev.ctrlKey)) return;
    const k=ev.key.toLowerCase();
    if(k==="b"){ ev.preventDefault(); run(wrap("**","bold text")); }
    else if(k==="i"){ ev.preventDefault(); run(wrap("*","italic text")); }
    else if(k==="k"){ ev.preventDefault(); run(link()); }
  };

  return(<div>
    <div className="mdbar">
      {B.map((b,i)=> b===null
        ? <span className="sep" key={"s"+i}></span>
        : <button type="button" key={b[0]} title={b[1]}
            className={b[3]==="b"?"b":b[3]==="i"?"i":""}
            onClick={()=>run(b[2])}>{b[0]}</button>)}
      <span className="mdbar-note">select text first, or click to insert</span>
    </div>
    <textarea ref={ref} className="md-ta" style={{minHeight:minHeight||230}}
      value={text} placeholder={placeholder}
      onChange={e=>onChange(e.target.value)} onKeyDown={onKey}/>
  </div>);
}

/* Multi-photo uploader for recaps: add several, reorder, first is the cover. */
function RecapPhotos({value,onChange}){
  const list=splitList(value);
  const ref=useRef();
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [over,setOver]=useState(false);
  const write=(arr)=>onChange(arr.join(", "));
  const take=async(files)=>{
    if(!files||!files.length) return;
    setErr(""); setBusy(true);
    const added=[];
    for(const file of Array.from(files).slice(0,12)){
      try{
        const {url,demo}=await uploadImage(file,"recaps",false);
        added.push(url);
        if(demo) setErr("Uploaded for preview only — connect Supabase Storage to save permanently.");
      }catch(e){ setErr(e.message||"One image failed to upload."); }
    }
    if(added.length) write([...list,...added]);
    setBusy(false);
  };
  const move=(i,d)=>{const j=i+d;if(j<0||j>=list.length)return;const a=list.slice();[a[i],a[j]]=[a[j],a[i]];write(a)};
  return(<div className="field">
    <label>Photos <span className="opt">(optional)</span></label>
    <div className={"drop"+(over?" over":"")+(busy?" busy":"")}
      onClick={()=>!busy&&ref.current.click()}
      onDragOver={e=>{e.preventDefault();setOver(true)}}
      onDragLeave={()=>setOver(false)}
      onDrop={e=>{e.preventDefault();setOver(false);take(e.dataTransfer.files)}}>
      <b>{busy?"Uploading…":"Drop photos here, or click to choose"}</b>
      <small>You can select several at once · resized automatically</small>
    </div>
    <input ref={ref} type="file" accept="image/*" multiple style={{display:"none"}}
      onChange={e=>{take(e.target.files); e.target.value=""}}/>
    {err&&<div className="hint" style={{color:"var(--danger)"}}>{err}</div>}
    {list.length>0&&<>
      <div className="recap-gal" style={{marginTop:12}}>
        {list.map((p,i)=>(<div key={i} style={{position:"relative"}}>
          <img src={p} alt=""/>
          {i===0&&<span className="pill next" style={{position:"absolute",top:5,left:5,margin:0}}>cover</span>}
          <span style={{position:"absolute",bottom:5,left:5,display:"flex",gap:3}}>
            <button type="button" className="mini" style={{padding:"2px 6px",fontSize:11}} onClick={()=>move(i,-1)} disabled={i===0}>←</button>
            <button type="button" className="mini" style={{padding:"2px 6px",fontSize:11}} onClick={()=>move(i,1)} disabled={i===list.length-1}>→</button>
            <button type="button" className="mini del" style={{padding:"2px 6px",fontSize:11}} onClick={()=>write(list.filter((_,j)=>j!==i))}>×</button>
          </span>
        </div>))}
      </div>
      <div className="hint">The first photo is the cover on the recap card — use ← → to reorder.</div>
    </>}
  </div>);
}

  /* Swap the two rows' order values, then renumber 1..n so the list can never

  const shift=async(idx,dir)=>{
    const j=idx+dir;
    if(j<0||j>=sorted.length) return;
    const arr=sorted.slice();
    [arr[idx],arr[j]]=[arr[j],arr[idx]];
    for(let k=0;k<arr.length;k++){

            {m.photo
              ? <img src={m.photo} alt="" style={{objectPosition:posCSS(m.pos),transform:`scale(${zoomNum(m.zoom)})`,transformOrigin:posCSS(m.pos)}}/>
              : <span style={{fontSize:11,fontWeight:600,color:"var(--ink-soft)"}}>{initials(m.name)}</span>}
          </span>
          <div className="meta"><b>{m.name}</b><small>
            {m.role} · #{m.order}{m.year?" · "+m.year:""}
            {majors.length?" · "+majors.join(" + "):""}
            {has.length?" · has "+has.join(", "):""}</small></div>

        <div className="acts"><button className="mini" onClick={()=>setEdit(m)}>Edit</button>
          <button className="mini del" onClick={()=>window.confirm("Remove "+m.name+"?")&&t.remove(m.id)}>Delete</button></div>

        {majors.length>1&&<button type="button" onClick={()=>delMajor(i)} aria-label="Remove major">×</button>}
      </div>))}

      <div className="hint">Pulled from a fixed list so spelling stays consistent. To add an option, edit the <b>MAJORS</b> list at the top of the file.</div></div>

function MailAdmin({t,say}){
  const [q,setQ]=useState("");
  const [add,setAdd]=useState(null);
  const subUrl=location.origin+location.pathname+"#subscribe";
  const all=t.rows.slice().reverse();
  const active=all.filter(r=>(r.status||"active")==="active");
  const shown=all.filter(r=>{
    const s=q.trim().toLowerCase();
    return !s||[r.name,r.email,r.year,r.major].some(v=>(v||"").toLowerCase().includes(s));
  });
  const copyEmails=async()=>{
    if(ZOHO_SYNC_LIVE){
      say("Send from Zoho Campaigns — it tracks unsubscribes, this list doesn't.");
      return;
    }
    const list=active.map(r=>r.email).filter(Boolean).join(", ");
    if(!list){ say("No active emails to copy."); return; }
    say(await copyText(list)?`Copied ${active.length} email${active.length===1?"":"s"} — paste into BCC`:"Couldn't copy — try Export");
  };
  const toggle=(r)=>t.update(r.id,{status:(r.status||"active")==="active"?"unsubscribed":"active"});
  return(<>
    <div className="stat-preview" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
      <div className="sp"><b>{all.length}</b><small>{ZOHO_SYNC_LIVE?"captured here":"total on the list"}</small></div>
      <div className="sp"><b>{active.length}</b><small>{ZOHO_SYNC_LIVE?"sent to Zoho":"active"}</small></div>
      <div className="sp"><b>{all.length-active.length}</b><small>opted out here</small></div>
    </div>
    <ErrBar t={t} name="signups"/>
    {ZOHO_SYNC_LIVE
      ? <div className="handoff">
          <b>Zoho Campaigns is the mailing list now.</b> Sign-ups from this site are pushed there
          automatically, and Zoho handles unsubscribes. Send every email from Zoho — not from here.
          <br/><br/>
          Copying addresses out of this table is switched off on purpose: someone who unsubscribed
          in Zoho still shows as active here, so a BCC blast from this list would email people who
          asked you to stop.
          <br/><br/>
          <b>Export still works</b> — keep using it for backups and for handing the club over. Just
          don't send from it.
          {ZOHO_LIST_URL&&<><br/><br/><a href={ZOHO_LIST_URL} target="_blank" rel="noopener noreferrer">
            Open the list in Zoho Campaigns ↗</a></>}
        </div>
      : <div className="info-box"><b>This is the live mailing list.</b> Sign-ups land here automatically. <b>Copy all emails</b> puts every active address on your clipboard, comma-separated — paste straight into BCC in Outlook or Gmail.</div>}
    <div className="info-box">
      <b>Sign-up link for QR codes.</b> This page is just the mailing-list form — no nav, nothing else to get lost in. Put it on a QR code for tabling.
      <div className="qr-row">
        <span className="qr-url">{subUrl}</span>
        <button className="mini" onClick={async()=>say(await copyText(subUrl)?"Link copied":"Couldn't copy")}>Copy link</button>
        <a className="mini" href={subUrl} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}>Preview</a>
      </div>
    </div>
    <div className="panel-head">
      <input className="searchbar" placeholder="Search name, email, major…" value={q} onChange={e=>setQ(e.target.value)}/>
      <div className="acts">
        {!ZOHO_SYNC_LIVE&&<button className="mini" onClick={copyEmails}>Copy all emails</button>}
        <CsvBar specKey="signups" t={t} say={say}/>
        <button className="btn btn-primary" onClick={()=>setAdd({name:"",email:"",year:"",major:""})}>+ Add</button>
      </div>
    </div>
    {all.length===0
      ? <div className="empty">Nobody on the list yet. Sign-ups from the Join page appear here — put the site on a QR code at tabling and it fills itself. You can also add people by hand or import a sign-in sheet.</div>
      : shown.length===0
        ? <div className="empty">No one matches "{q}".</div>
        : <table className="sig"><thead><tr>
            <th>Name</th><th>Email</th><th>Year</th><th>Major</th><th>Joined</th><th></th></tr></thead>
            <tbody>{shown.map(r=>{const off=(r.status||"active")!=="active";return(<tr key={r.id} className={off?"off":""}>
              <td>{r.name||"—"}</td><td>{r.email}</td><td>{r.year||"—"}</td><td>{r.major||"—"}</td><td>{r.created}</td>
              <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
                <button className={"mini"+(off?" good":"")}
                  title={ZOHO_SYNC_LIVE?"Marks them here only — also unsubscribe them in Zoho":""}
                  onClick={()=>toggle(r)}>{off?"Resubscribe":"Unsubscribe"}</button>{" "}
                <button className="mini del" onClick={()=>window.confirm("Delete "+(r.name||r.email)+"?")&&t.remove(r.id)}>×</button>
              </td></tr>);})}</tbody></table>}
    {add&&<Modal title="Add to mailing list" onClose={()=>setAdd(null)}>
      <div className="field"><label>Full name <span className="opt">(optional)</span></label><input autoFocus value={add.name} onChange={e=>setAdd({...add,name:e.target.value})}/></div>
      <div className="field"><label>Email</label><input type="email" value={add.email} onChange={e=>setAdd({...add,email:e.target.value})} placeholder="abc123@pitt.edu"/></div>
      <div className="f2">
        <div className="field"><label>Year</label>
          <select value={add.year} onChange={e=>setAdd({...add,year:e.target.value})}>{YEARS.map(y=><option key={y} value={y}>{y||"—"}</option>)}</select></div>
        <div className="field"><label>Major</label>
          <select value={add.major} onChange={e=>setAdd({...add,major:e.target.value})}>
            <option value="">—</option>{MAJORS.map(m=><option key={m}>{m}</option>)}</select></div>
      </div>
      <div className="modal-acts"><button className="mini" onClick={()=>setAdd(null)}>Cancel</button>
        <button className="btn btn-primary" onClick={async()=>{
          if(!add.email.includes("@")) return;
          await t.add({...add,status:"active",source:"manual",created:todayISO()});
          setAdd(null);say("Added to the list");
        }}>Add</button></div>
    </Modal>}
  </>);
}

/* ================= ROOT ================= */
function App(){
  const routeOf=()=>{
    const h=(location.hash||"").toLowerCase();
    if(h==="#admin") return "admin";
    if(h==="#subscribe"||h==="#join-list") return "subscribe";
    return "public";
  };
  const [view,setView]=useState(routeOf);
  useEffect(()=>{
    const onHash=()=>{setView(routeOf());window.scrollTo(0,0)};
    window.addEventListener("hashchange",onHash);
    return ()=>window.removeEventListener("hashchange",onHash);
  },[]);
  const go=(v)=>{
    location.hash = v==="admin"?"admin" : v==="subscribe"?"subscribe" : "";
    setView(v); window.scrollTo(0,0);
  };
  /* The subscribe page needs its own signups handle, since it renders outside
     the main site tree. */
  const signups=useTable("signups",SEED.signups,"id",{fetch:false});
  if(view==="admin") return <Admin toSite={()=>go("public")}/>;
  if(view==="subscribe") return <SubscribePage signups={signups} toSite={()=>go("public")}/>;
  return <Public toAdmin={()=>go("admin")}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

/* Publish upcoming events as schema.org Event data once they've loaded, so
   search engines can read the real schedule rather than only the static
   organisation block in <head>. */

/* US Eastern offset for a given date. Hardcoding -05:00 was wrong for most of
   the fall: DST runs from the second Sunday in March to the first Sunday in
   November, so Sep/Oct events are -04:00 and only Nov/Dec are -05:00. */
function easternOffset(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const nthSunday=(year,month,n)=>{           // month is 1-based
    const first=new Date(Date.UTC(year,month-1,1));
    const day=1+((7-first.getUTCDay())%7)+(n-1)*7;
    return new Date(Date.UTC(year,month-1,day));
  };
  const start=nthSunday(y,3,2);               // DST begins, 2nd Sunday of March
  const end=nthSunday(y,11,1);                // DST ends, 1st Sunday of November
  const t=Date.UTC(y,m-1,d);
  return (t>=start.getTime()&&t<end.getTime()) ? "-04:00" : "-05:00";
}

(async function eventSchema(){
  if(!LIVE) return;
  try{
    const {data}=await sb.from("events").select("*").order("date");
    if(!data) return;
    const items=data.filter(e=>!isPast(e.date)).map(e=>{
      const off=easternOffset(e.date);
      const ev={
        "@context":"https://schema.org","@type":"Event",
        name:e.title,
        startDate:`${e.date}T${normTime(e.time)}:00${off}`,
        endDate:`${e.date}T${endOf(e)}:00${off}`,
        eventStatus:"https://schema.org/EventScheduled",
        eventAttendanceMode:"https://schema.org/OfflineEventAttendanceMode",
        location:{"@type":"Place",name:e.location,
          address:{"@type":"PostalAddress",addressLocality:"Pittsburgh",addressRegion:"PA",addressCountry:"US"}},
        image:["https://pittupaa.com/og-image.png"],
        organizer:{"@type":"Organization",
          name:"University of Pittsburgh Accounting Association",url:"https://pittupaa.com/"},
        isAccessibleForFree:true,
        offers:{"@type":"Offer",price:"0",priceCurrency:"USD",
          availability:"https://schema.org/InStock",
          url:"https://pittupaa.com/",validFrom:`${e.date}T00:00:00${off}`},
      };
      if(e.desc) ev.description=e.desc;
      // the presenting firm is the closest match for "performer"
      if(e.firm) ev.performer={"@type":"Organization",name:e.firm};
      return ev;
    });
    if(!items.length) return;
    const s=document.createElement("script");
    s.type="application/ld+json";
    s.textContent=JSON.stringify(items);
    document.head.appendChild(s);
  }catch(e){ /* structured data is a nicety; never break the page for it */ }
})();
