<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UPAA — University of Pittsburgh Accounting Association</title>
<meta name="description" content="The University of Pittsburgh Accounting Association connects Pitt students with recruiters and professionals from leading public accounting firms. Meetings Wednesdays at 7PM in 2500 Sennott Square." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0A2342; --navy-2:#12345B; --gold:#FFB81C; --gold-deep:#B87D00;
    --paper:#F7F5EF; --paper-2:#EFEBE0; --ink:#1A1F26; --ink-soft:#4A5361;
    --line:#D9D3C4; --white:#FFFFFF; --danger:#B03A32; --ok:#2E7D5B;
    --shadow:0 1px 2px rgba(10,35,66,.06),0 8px 24px rgba(10,35,66,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .serif{font-family:'Fraunces',Georgia,serif}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .ticker{background:var(--navy);color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;padding:7px 0;overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--gold)}
  .ticker span{display:inline-block;padding-left:100%;animation:tick 30s linear infinite}
  @keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

  nav{position:sticky;top:0;z-index:50;background:rgba(247,245,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:none;font:inherit;text-align:left}
  .brand-mark{width:38px;height:38px;background:var(--navy);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-mark b{color:var(--white);font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:-.5px}
  .brand-mark b .g{color:var(--gold)}
  .brand-txt small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .brand-txt strong{font-family:'Fraunces',serif;font-size:17px;font-weight:600;letter-spacing:-.3px;color:var(--navy)}
  .nav-links{display:flex;gap:2px;align-items:center}
  .nav-links button{font:inherit;font-size:14px;font-weight:500;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:8px 11px;border-radius:6px;transition:.15s;white-space:nowrap}
  .nav-links button:hover{color:var(--navy);background:var(--paper-2)}
  .nav-links button.on{color:var(--navy);font-weight:600}
  .nav-cta{background:var(--navy)!important;color:var(--paper)!important;font-weight:600!important;margin-left:6px}
  .nav-cta:hover{background:var(--navy-2)!important}
  .burger{display:none;background:none;border:none;cursor:pointer;font-size:22px;color:var(--navy)}

  main{max-width:1120px;margin:0 auto;padding:0 24px}
  .section{padding:72px 0}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:9px}
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--gold-deep)}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;line-height:1.08;letter-spacing:-.02em;color:var(--navy)}
  .h-sec{font-size:clamp(28px,4vw,40px);margin-bottom:16px}
  .lead{font-size:18px;color:var(--ink-soft);max-width:62ch}

  .hero{position:relative;padding:80px 0 68px;overflow:hidden}
  .hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.5;mask-image:radial-gradient(ellipse 80% 70% at 70% 30%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 70% at 70% 30%,#000 30%,transparent 75%)}
  .hero-in{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  .hero h1{font-size:clamp(38px,6vw,62px);margin-bottom:20px}
  .hero h1 em{font-style:italic;color:var(--gold-deep)}
  .hero p{font-size:19px;color:var(--ink-soft);max-width:48ch;margin-bottom:16px}
  .meet-line{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--navy);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:9px 13px;display:inline-block;margin-bottom:26px}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:600;font-size:15px;padding:13px 22px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-primary{background:var(--navy);color:var(--paper)}
  .btn-primary:hover:not(:disabled){background:var(--navy-2);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--navy);background:var(--white)}

  .ledger{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .ledger-top{background:var(--navy);color:var(--paper);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em}
  .ledger-top .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .ledger-row{display:grid;grid-template-columns:1fr auto;padding:12px 18px;border-bottom:1px solid var(--paper-2);font-size:14px;gap:12px}
  .ledger-row:last-of-type{border-bottom:none}
  .ledger-row span:first-child{color:var(--ink-soft)}
  .ledger-row span:last-child{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--navy);text-align:right}
  .ledger-foot{background:var(--paper-2);padding:12px 18px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--navy)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stat{background:var(--paper);padding:26px 22px}
  .stat b{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--navy);display:block;line-height:1}
  .stat small{font-size:13px;color:var(--ink-soft);font-weight:500}

  .grid{display:grid;gap:20px}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:26px;transition:.15s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .card .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold-deep);font-weight:500}
  .card h3{font-size:20px;margin:10px 0 8px}
  .card p{font-size:14.5px;color:var(--ink-soft)}

  /* ---- e-board ---- */
  .board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .member{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.15s;display:flex;flex-direction:column}
  .member:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .member .ph{aspect-ratio:1;background:linear-gradient(140deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;position:relative}
  .member .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .member .ph .init{font-family:'Fraunces',serif;font-size:44px;color:var(--paper);font-weight:600;letter-spacing:1px}
  .member .ph .tag{position:absolute;top:12px;left:12px;background:var(--gold);color:var(--navy);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;padding:4px 8px;border-radius:5px}
  .member .info{padding:16px 18px;flex:1;display:flex;flex-direction:column}
  .member .info b{font-family:'Fraunces',serif;font-size:18px;color:var(--navy);display:block}
  .member .info .role{font-size:12.5px;color:var(--gold-deep);font-weight:600;text-transform:uppercase;letter-spacing:.03em;display:block}
  .member .info .yr{font-size:13px;color:var(--ink-soft);margin-top:7px;display:block}
  .member .info .majors{margin-top:3px;display:flex;flex-wrap:wrap;gap:5px}
  .member .info .majors span{font-size:11.5px;color:var(--navy);background:var(--paper-2);border-radius:99px;padding:2px 9px;white-space:nowrap}
  .member .info .bio{font-size:13.5px;color:var(--ink-soft);margin-top:10px;line-height:1.55;display:block}
  .m-links{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--paper-2)}
  .m-links a{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:.15s}
  .m-links a:hover{border-color:var(--navy);color:var(--navy);background:var(--paper)}
  .m-links svg{width:15px;height:15px;fill:currentColor}

  /* ---- events list ---- */
  .event{display:grid;grid-template-columns:88px 1fr;gap:20px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px;transition:.15s}
  .event:hover{box-shadow:var(--shadow)}
  .event.past{opacity:.62}
  .event .date{text-align:center;border-right:1px solid var(--line);padding-right:16px}
  .event .date b{font-family:'Fraunces',serif;font-size:26px;color:var(--navy);display:block;line-height:1}
  .event .date small{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep)}
  .event .body b{font-size:17px;color:var(--navy);display:block;margin-bottom:3px}
  .event .body p{font-size:14px;color:var(--ink-soft)}
  .event .body .where{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:7px}
  .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--paper-2);color:var(--ink-soft);margin-left:8px;vertical-align:middle}
  .pill.next{background:var(--gold);color:var(--navy)}
  .pill.type{background:var(--navy);color:var(--paper)}
  .pill.recap{background:var(--gold-deep);color:var(--white);cursor:pointer;border:none;font-family:'JetBrains Mono',monospace}

  /* ---- calendar ---- */
  .view-toggle{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .view-toggle button{font:inherit;font-size:13px;font-weight:600;padding:7px 15px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--ink-soft)}
  .view-toggle button.on{background:var(--white);color:var(--navy);box-shadow:0 1px 2px rgba(10,35,66,.1)}
  .cal{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:26px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .cal-head b{font-family:'Fraunces',serif;font-size:19px;color:var(--navy)}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{width:32px;height:32px;border:1px solid var(--line);background:var(--paper);border-radius:7px;cursor:pointer;color:var(--navy);font-size:15px;line-height:1}
  .cal-nav button:hover{border-color:var(--navy)}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--paper-2);border-bottom:1px solid var(--line)}
  .cal-dow span{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:9px 6px;text-align:center;font-weight:500}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-cell{min-height:92px;border-right:1px solid var(--paper-2);border-bottom:1px solid var(--paper-2);padding:7px 8px}
  .cal-cell:nth-child(7n){border-right:none}
  .cal-cell.dim{background:var(--paper);opacity:.5}
  .cal-cell.today{background:rgba(255,184,28,.09)}
  .cal-cell .dn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft)}
  .cal-cell.today .dn{color:var(--navy);font-weight:600;background:var(--gold);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
  .cal-ev{display:block;width:100%;text-align:left;font-size:11px;font-weight:500;line-height:1.3;background:var(--navy);color:var(--paper);border:none;border-radius:5px;padding:4px 6px;margin-top:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-ev:hover{background:var(--navy-2)}
  .cal-ev.pastev{background:var(--paper-2);color:var(--ink-soft)}
  .cal-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

  /* ---- recruiters ---- */
  .spons{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .spon{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:22px 18px;text-align:center;display:flex;align-items:center;justify-content:center;min-height:100px;transition:.15s}
  .spon:hover{border-color:var(--gold);transform:translateY(-2px)}
  .spon img{max-width:100%;max-height:52px;width:auto;height:auto;object-fit:contain;display:block}
  .spon .txt{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--navy);line-height:1.2}

  /* ---- recaps ---- */
  .recap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .recap{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.15s;cursor:pointer;text-align:left;padding:0;font:inherit;display:flex;flex-direction:column}
  .recap:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .recap .cover{aspect-ratio:16/9;background:linear-gradient(140deg,var(--navy),var(--navy-2));overflow:hidden;display:flex;align-items:center;justify-content:center}
  .recap .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .recap .cover .ph-mark{font-family:'Fraunces',serif;font-size:26px;color:rgba(247,245,239,.35);font-weight:600}
  .recap .rbody{padding:20px 22px;flex:1;display:flex;flex-direction:column}
  .recap .rdate{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-deep);font-weight:500}
  .recap h3{font-size:19px;margin:7px 0 8px}
  .recap p{font-size:14px;color:var(--ink-soft);line-height:1.6}
  .recap .by{font-size:12.5px;color:var(--ink-soft);margin-top:12px;padding-top:12px;border-top:1px solid var(--paper-2)}
  .recap-full p{font-size:15px;color:var(--ink);line-height:1.75;margin-bottom:14px;white-space:pre-wrap}
  .recap-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-top:16px}
  .recap-gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

  .join{background:var(--navy);border-radius:16px;padding:48px;color:var(--paper);position:relative;overflow:hidden}
  .join::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border:2px solid rgba(255,184,28,.2);border-radius:50%}
  .join h2{color:var(--paper);font-size:32px;margin-bottom:12px}
  .join p{color:rgba(247,245,239,.82);max-width:52ch;margin-bottom:24px}
  .join .btn-gold{background:var(--gold);color:var(--navy)}
  .join .btn-gold:hover{background:#e8a800}
  .join .btn-out{background:transparent;color:var(--paper);border-color:rgba(247,245,239,.32)}
  .join .btn-out:hover{border-color:var(--paper)}
  .dues{background:rgba(255,184,28,.12);border:1px solid rgba(255,184,28,.4);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--paper);margin-bottom:24px;position:relative;z-index:1}
  .dues b{color:var(--gold)}
  .signup-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:30px;margin-top:22px;max-width:520px}
  .signup-card h3{font-size:21px;margin-bottom:6px}
  .signup-card>p{font-size:14.5px;color:var(--ink-soft);margin-bottom:20px}
  .ok-msg{background:#E8F5EE;border:1px solid var(--ok);color:#1d5e43;border-radius:10px;padding:14px 16px;font-size:14px}

  footer{border-top:1px solid var(--line);margin-top:40px;padding:40px 0}
  .foot-in{max-width:1120px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
  .foot-in small{color:var(--ink-soft);font-size:13px}
  .foot-links{display:flex;gap:18px;font-size:13px;font-weight:500}
  .foot-links a{color:var(--ink-soft);cursor:pointer}
  .foot-links a:hover{color:var(--navy)}

  /* ---- admin ---- */
  .admin-wrap{min-height:100vh;background:var(--paper-2)}
  .login-box{max-width:380px;margin:80px auto;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:36px;box-shadow:var(--shadow)}
  .login-box h2{font-size:24px;margin-bottom:6px}
  .login-box>p{font-size:14px;color:var(--ink-soft);margin-bottom:22px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
  .field .opt{font-weight:400;color:var(--ink-soft)}
  .field input,.field textarea,.field select{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
  .field textarea{min-height:74px;resize:vertical}
  .field .hint{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .major-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .major-row select{flex:1}
  .major-row button{width:34px;height:38px;flex-shrink:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;cursor:pointer;color:var(--danger);font-size:16px;line-height:1}
  .major-row button:hover{border-color:var(--danger);background:#fbeceb}
  .add-major{font:inherit;font-size:13px;font-weight:600;color:var(--navy);background:none;border:1px dashed var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;width:100%}
  .add-major:hover{border-color:var(--navy);background:var(--paper)}
  .admin-top{background:var(--navy);color:var(--paper);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .admin-top b{font-family:'Fraunces',serif;font-size:18px}
  .admin-top .r{display:flex;gap:10px;align-items:center;font-size:13px}
  .admin-body{max-width:1000px;margin:0 auto;padding:28px 24px 60px}
  .tabs{display:flex;gap:6px;margin-bottom:24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{font:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-bottom:2px solid transparent;padding:11px 14px;cursor:pointer;margin-bottom:-1px}
  .tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:14px;flex-wrap:wrap}
  .panel-head h3{font-size:20px}
  .panel-head .acts{display:flex;gap:8px;flex-wrap:wrap}
  .adm-item{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .adm-item .meta b{color:var(--navy)}
  .adm-item .meta small{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px}
  .adm-item .acts{display:flex;gap:8px;flex-shrink:0}

function useTable(table, seed, orderBy){
  const [rows,setRows]=useState(seed);
  const [err,setErr]=useState("");
  useEffect(()=>{
    if(!LIVE) return;
    let alive=true;
    (async()=>{
      try{
        let q=sb.from(table).select("*");
        if(orderBy) q=q.order(orderBy);
        const {data,error}=await q;
        if(error) throw error;
        if(alive&&data) setRows(data);
      }catch(e){ if(alive) setErr(e.message||"Could not load "+table); }
    })();
    return ()=>{alive=false};
  },[]);
  return {
    rows, err,
    async add(row){
      if(LIVE){
        const {data,error}=await sb.from(table).insert(row).select();
        if(error){setErr(error.message);return false;}
        if(data) setRows(r=>[...r,...data]);
      } else setRows(r=>[...r,{...row,id:Date.now()+Math.random()}]);
      return true;
    },
    async addMany(list){
      if(!list.length) return true;
      if(LIVE){
        const {data,error}=await sb.from(table).insert(list).select();
        if(error){setErr(error.message);return false;}
        if(data) setRows(r=>[...r,...data]);
      } else setRows(r=>[...r,...list.map(x=>({...x,id:Date.now()+Math.random()}))]);
      return true;
    },
    async update(id,row){
      if(LIVE){
        const {error}=await sb.from(table).update(row).eq("id",id);
        if(error){setErr(error.message);return false;}
      }
      setRows(r=>r.map(x=>x.id===id?{...x,...row}:x));
      return true;
    },
    async remove(id){
      if(LIVE){
        const {error}=await sb.from(table).delete().eq("id",id);
        if(error){setErr(error.message);return false;}
      }
      setRows(r=>r.filter(x=>x.id!==id));
      return true;
    },
  };
}

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const todayISO=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`};
const isPast=(iso)=>iso<todayISO();

/* Strict majors parser, used on CSV import so the page never ends up with
   "Finance & Accounting" next to "Accounting and Finance". Splits on commas,
   semicolons, pipes, ampersands and the word "and", matches case-insensitively
   against MAJORS, de-dupes, and reports anything it couldn't match. */
function parseMajors(raw){
  const parts=(raw||"").split(/\s*(?:[,;|&]|\band\b)\s*/i).map(x=>x.trim()).filter(Boolean);
  const kept=[],unknown=[];
  parts.forEach(p=>{
    const hit=MAJORS.find(m=>m.toLowerCase()===p.toLowerCase());
    if(hit){ if(!kept.includes(hit)) kept.push(hit); }
    else unknown.push(p);
  });
  return {majors:kept.join(", "),unknown};
}

function toCSV(head, rows){
  const esc=v=>`"${(v??"").toString().replace(/"/g,'""')}"`;
  return [head.map(esc).join(","),...rows.map(r=>r.map(esc).join(","))].join("\r\n");
}
function download(name, text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"}));
  a.download=name;a.click();
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(c==='"'){q=false;}
      else cell+=c;
    } else {
      if(c==='"') q=true;
      else if(c===","){row.push(cell);cell="";}
      else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
      else if(c!=="\r") cell+=c;
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta);return ok;
  }
}

function CsvBar({specKey,t,say}){
  const spec=CSV[specKey];

  const [imp,setImp]=useState(null);

  const template=()=>{
    download(spec.file+"-template.csv", toCSV(spec.cols, spec.sample));
    say&&say("Template downloaded");
  };
  const exportAll=()=>{
    if(!t.rows.length){ say&&say("Nothing to export yet"); return; }
    download(spec.file+".csv", toCSV(spec.cols, t.rows.map(spec.out)));
  };
  const onFile=async(ev)=>{
    const file=ev.target.files?.[0]; if(!file) return;
    let rows;
    try{ rows=parseCSV(await file.text()); }
    catch(e){ setImp({error:"Couldn't read that file. Make sure it's saved as CSV."}); return; }
    ev.target.value="";
    if(rows.length<2){ setImp({error:"That file has a header row but no data rows."}); return; }
    const head=rows[0].map(h=>h.trim().toLowerCase().replace(/^\uFEFF/,""));
    const missing=spec.required.filter(c=>!head.includes(c));
    if(missing.length){
      setImp({error:`Missing required column${missing.length>1?"s":""}: ${missing.join(", ")}. Download the template to see the expected format.`});
      return;
    }
    const seen=new Set(spec.dedupeOn?t.rows.map(r=>(r[spec.dedupeOn]||"").toLowerCase()):[]);
    const good=[],bad=[],warn=new Set();
    rows.slice(1).forEach((r,i)=>{
      const g=(c)=>{const k=head.indexOf(c);return k>=0?(r[k]||"").trim():""};
      const built=spec.build(g);
      if(!spec.valid(built)){ bad.push(i+2); return; }
      if(spec.dedupeOn){
        const key=(built[spec.dedupeOn]||"").toLowerCase();
        if(seen.has(key)) return;
        seen.add(key);
      }
      if(built._unknown&&built._unknown.length) built._unknown.forEach(u=>warn.add(u));
      delete built._unknown;
      good.push(built);
    });
    if(!good.length){ setImp({error:"No valid rows found."+(bad.length?` Check row${bad.length>1?"s":""} ${bad.slice(0,6).join(", ")}.`:"")+" "+spec.notes}); return; }
    setImp({rows:good,skipped:bad.length,warn:[...warn]});
  };
  const doImport=async(replace)=>{
    if(replace){ for(const r of t.rows.slice()) await t.remove(r.id); }
    await t.addMany(imp.rows);
    say&&say(`${replace?"Replaced with":"Added"} ${imp.rows.length} row${imp.rows.length===1?"":"s"}`);
    setImp(null);
  };

  return(<>
    <button className="mini" onClick={template}>Template</button>
    <button className="mini" onClick={exportAll}>Export</button>
    <button className="mini" onClick={()=>fileRef.current.click()}>Import</button>
    <input ref={fileRef} type="file" accept=".csv,text/csv" style={{display:"none"}} onChange={onFile}/>
    {imp&&<Modal title={imp.error?"Import problem":"Confirm import"} onClose={()=>setImp(null)}>
      {imp.error
        ? <><p style={{fontSize:14,color:"var(--danger)",marginBottom:10}}>{imp.error}</p>
            <div className="cols">Expected columns: {spec.cols.join(", ")}</div>
            <div className="modal-acts">
              <button className="mini" onClick={()=>{template();setImp(null)}}>Download template</button>
              <button className="btn btn-primary" onClick={()=>setImp(null)}>Close</button></div></>
        : <><p style={{fontSize:14,color:"var(--ink-soft)",marginBottom:14}}>
              Found <b>{imp.rows.length}</b> valid row{imp.rows.length===1?"":"s"}
              {imp.skipped?<> · <span style={{color:"var(--danger)"}}>{imp.skipped} skipped</span></>:null}
              {spec.dedupeOn?" · duplicates skipped":""}.</p>
            <div style={{maxHeight:200,overflow:"auto",border:"1px solid var(--line)",borderRadius:8,marginBottom:14}}>
              {imp.rows.map((r,i)=><div key={i} style={{padding:"9px 12px",borderBottom:"1px solid var(--paper-2)",fontSize:13,color:"var(--navy)"}}>{spec.label(r)}</div>)}
            </div>
            {imp.warn&&imp.warn.length>0&&<div className="banner" style={{marginBottom:14}}><span>⚠️</span><div>
              <b>Dropped {imp.warn.length} unrecognized major{imp.warn.length>1?"s":""}:</b> {imp.warn.join(", ")}.
              Majors have to match the standard list exactly. Either fix the spelling in your file, or add the option to the <b>MAJORS</b> list at the top of index.html.
            </div></div>}
            <div className="modal-acts">
              <button className="mini" onClick={()=>setImp(null)}>Cancel</button>
              <button className="mini" onClick={()=>doImport(false)}>Add to existing</button>
              <button className="btn btn-primary" onClick={()=>window.confirm(`Delete all ${t.rows.length} current row(s) and replace with these ${imp.rows.length}?`)&&doImport(true)}>Replace all</button>
            </div></>}
    </Modal>}
  </>);
}

function Calendar({events}){
  const firstUpcoming=events.find(e=>!isPast(e.date));
  const anchor=firstUpcoming? new Date(firstUpcoming.date+"T00:00:00") : new Date();
  const [cur,setCur]=useState({y:anchor.getFullYear(),m:anchor.getMonth()});
  const [sel,setSel]=useState(null);
  const byDate=useMemo(()=>{const map={};events.forEach(e=>{(map[e.date]=map[e.date]||[]).push(e)});return map;},[events]);
  const shift=(n)=>setCur(c=>{const d=new Date(c.y,c.m+n,1);return {y:d.getFullYear(),m:d.getMonth()}});
  const first=new Date(cur.y,cur.m,1);
  const startPad=first.getDay();
  const daysInMonth=new Date(cur.y,cur.m+1,0).getDate();
  const daysPrev=new Date(cur.y,cur.m,0).getDate();
  const cells=[];
  for(let i=startPad-1;i>=0;i--) cells.push({day:daysPrev-i,dim:true});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,dim:false});
  let next=1; while(cells.length%7!==0) cells.push({day:next++,dim:true});
  const iso=(d)=>`${cur.y}-${String(cur.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const today=todayISO();
  return(<>
    <div className="cal">
      <div className="cal-head">
        <b>{MONF[cur.m]} {cur.y}</b>
        <div className="cal-nav">
          <button onClick={()=>shift(-1)} aria-label="Previous month">‹</button>
          <button onClick={()=>setCur({y:new Date().getFullYear(),m:new Date().getMonth()})} style={{width:"auto",padding:"0 11px",fontSize:12,fontWeight:600}}>Today</button>
          <button onClick={()=>shift(1)} aria-label="Next month">›</button>
        </div>
      </div>
      <div className="cal-dow">{["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><span key={d}>{d}</span>)}</div>
      <div className="cal-grid">
        {cells.map((c,i)=>{
          const dISO=c.dim?null:iso(c.day);
          const evs=dISO?(byDate[dISO]||[]):[];
          return (<div key={i} className={"cal-cell"+(c.dim?" dim":"")+(dISO===today?" today":"")}>
            <span className="dn">{c.day}</span>
            {evs.map(e=>(<button key={e.id} className={"cal-ev"+(isPast(e.date)?" pastev":"")} onClick={()=>setSel(e)} title={e.title}>{e.firm||e.title}</button>))}
          </div>);
        })}
      </div>
      <div className="cal-foot">
        <span><span className="swatch" style={{background:"var(--navy)"}}></span>Upcoming</span>
        <span><span className="swatch" style={{background:"var(--paper-2)",border:"1px solid var(--line)"}}></span>Past</span>
        <span style={{marginLeft:"auto"}}>Tap an event for details</span>
      </div>
    </div>
    {sel&&<Modal title={sel.title} onClose={()=>setSel(null)}>
      <p style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12.5,color:"var(--gold-deep)",marginBottom:12,textTransform:"uppercase",letterSpacing:".06em"}}>
        {fmtDate(sel.date).full}{sel.type?" · "+sel.type:""}</p>
      {sel.desc&&<p style={{fontSize:14.5,color:"var(--ink-soft)",marginBottom:12}}>{sel.desc}</p>}
      <p style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12.5,color:"var(--ink-soft)"}}>📍 {sel.location}</p>
      <div className="modal-acts"><button className="btn btn-primary" onClick={()=>setSel(null)}>Close</button></div>
    </Modal>}
  </>);
}

function RecapAdmin({t,events,say}){
  const [edit,setEdit]=useState(null);
  const sorted=t.rows.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const save=async(r)=>{ r.id?await t.update(r.id,r):await t.add(r); setEdit(null); };
  const pastEvents=events.rows.filter(e=>isPast(e.date)).sort((a,b)=>b.date.localeCompare(a.date));
  const covered=new Set(t.rows.map(r=>r.date));
  const missing=pastEvents.filter(e=>!covered.has(e.date));
  return(<>
    <div className="info-box"><b>Recaps show up on the public Recaps page</b>, and a "read recap" button appears next to the matching past event on the Events page. Matching is by <b>date</b> — give a recap the same date as its event and they link automatically.</div>
    {missing.length>0&&<div className="banner"><span>📝</span><div>
      <b>{missing.length} past event{missing.length>1?"s":""} without a recap yet:</b>{" "}
      {missing.slice(0,4).map(e=>e.title).join("; ")}{missing.length>4?`; and ${missing.length-4} more`:""}.
    </div></div>}
    <div className="panel-head"><h3 className="serif">Event Recaps</h3>
      <div className="acts"><CsvBar specKey="recaps" t={t} say={say}/>

function MemberForm({init,onSave,onCancel}){
  const [f,setF]=useState({year:"",majors:"",linkedin:"",email:"",bio:"",photo:"",...init});
  const [majors,setMajors]=useState(()=>{const l=splitList(init.majors||init.major);return l.length?l:[""]});
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const setMajor=(i,v)=>setMajors(l=>l.map((x,j)=>j===i?v:x));
  const addMajor=()=>setMajors(l=>[...l,""]);
  const delMajor=(i)=>setMajors(l=>l.length===1?[""]:l.filter((_,j)=>j!==i));

  const submit=()=>{
    if(!f.name.trim()||!f.role.trim()) return;
    const clean=[...new Set(majors.filter(Boolean))];
    onSave({...f,majors:clean.join(", ")});

  return(<>

    </div>
    <div className="field"><label>Majors <span className="opt">(optional)</span></label>
      {majors.map((m,i)=>(<div className="major-row" key={i}>
        <select value={m} onChange={e=>setMajor(i,e.target.value)}>
          <option value="">Select a major…</option>
          {MAJORS.filter(x=>x===m||!used.includes(x)).map(x=><option key={x} value={x}>{x}</option>)}
        </select>

      <input value={f.linkedin||""} onChange={e=>set("linkedin",e.target.value)} placeholder="https://www.linkedin.com/in/..."/></div>
    <div className="field"><label>Email <span className="opt">(optional)</span></label>
      <input value={f.email||""} onChange={e=>set("email",e.target.value)} placeholder="abc123@pitt.edu"/></div>
    <div className="field"><label>Photo URL <span className="opt">(optional)</span></label>
      <input value={f.photo||""} onChange={e=>set("photo",e.target.value)} placeholder="https://..."/>

              <td>{r.name||"—"}</td><td>{r.email}</td><td>{r.year||"—"}</td><td>{r.major||"—"}</td><td>{r.created}</td>
              <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
                <button className={"mini"+(off?" good":"")} onClick={()=>toggle(r)}>{off?"Resubscribe":"Unsubscribe"}</button>{" "}
                <button className="mini del" onClick={()=>window.confirm("Delete "+(r.name||r.email)+"?")&&t.remove(r.id)}>×</button>
              </td></tr>);})}</tbody></table>}
    {add&&<Modal title="Add to mailing list" onClose={()=>setAdd(null)}>
      <div className="field"><label>Full name <span className="opt">(optional)</span></label><input autoFocus value={add.name} onChange={e=>setAdd({...add,name:e.target.value})}/></div>
      <div className="field"><label>Email</label><input type="email" value={add.email} onChange={e=>setAdd({...add,email:e.target.value})} placeholder="abc123@pitt.edu"/></div>
      <div className="f2">
        <div className="field"><label>Year</label>
          <select value={add.year} onChange={e=>setAdd({...add,year:e.target.value})}>{YEARS.map(y=><option key={y} value={y}>{y||"—"}</option>)}</select></div>
        <div className="field"><label>Major</label>
          <select value={add.major} onChange={e=>setAdd({...add,major:e.target.value})}>
            <option value="">—</option>{MAJORS.map(m=><option key={m}>{m}</option>)}</select></div>
      </div>
      <div className="modal-acts"><button className="mini" onClick={()=>setAdd(null)}>Cancel</button>
        <button className="btn btn-primary" onClick={async()=>{
          if(!add.email.includes("@")) return;
          await t.add({...add,status:"active",source:"manual",created:todayISO()});
          setAdd(null);say("Added to the list");
        }}>Add</button></div>
    </Modal>}
  </>);
}

/* ================= ROOT ================= */
function App(){
  const [view,setView]=useState(location.hash==="#admin"?"admin":"public");
  useEffect(()=>{
    const onHash=()=>setView(location.hash==="#admin"?"admin":"public");
    window.addEventListener("hashchange",onHash);
    return ()=>window.removeEventListener("hashchange",onHash);
  },[]);
  const go=(v)=>{ location.hash = v==="admin"?"admin":""; setView(v); window.scrollTo(0,0); };
  return view==="admin"
    ? <Admin toSite={()=>go("public")}/>
    : <Public toAdmin={()=>go("admin")}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
